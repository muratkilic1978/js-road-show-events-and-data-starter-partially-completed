<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Road Show - Events og Data</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section id="scene" class="scene" >
            <div id="sun" class="sun"></div>
            <div class="bg">
                <img src="img/red-car.png" id="redCar" class="car1">
                <img src="img/car.gif" id="policeCar" class="car2">
                <img src="img/light-blue-car.png" id="blueCar" class="car3">
            </div>
        </section>
        <div id="tooltip" class="tooltip" aria-live="polite">

        </div>
    </main>
    <!--

    5. Efter section.scene, men stadig inde i <main>:
         et <div> med id="tooltip" og class="tooltip".
         Husk fra ARIA-øvelsen: giv den også aria-live="polite",
         så skærmlæsere læser teksten op, når den skifter.
    -->

    <!--
    ===========================================================
    EKSTRAOPGAVE (når klasseøvelsen virker): en bus og en truck
    ===========================================================
    Du skal nu udvide road showet med to nye køretøjer.
    Opgaven går igennem alle tre filer: først HTML, så CSS, til sidst JavaScript.

    E1. Tilføj en bus
        Tilføj et nyt <img>-element inde i div.bg, efter den blå bil.
        Billedet ligger klar i img-mappen. Kig selv i mappen og find filnavnet.
            id="bus"    class="bus"
        Husk en god alt-tekst, der beskriver bussen og retningen, den kører.

    E2. Tilføj en truck
        Gør det samme for truck'en:
            id="truck"  class="truck"

    Tænk over: hvorfor skal id'et være præcis "bus" og "truck"?
    (Hint: kig i script.js, hvordan bilerne bliver fundet.)

    Når du har lavet HTML'en, kan du se billederne på siden, men de står stille
    og er måske alt for store. Det løser du i style.css.
    -->



    <!-- Husk fra dag 1: skriv scriptet, der linker til js/script.js, herunder -->
    <script src="js/script.js"></script>
</body>
</html>
